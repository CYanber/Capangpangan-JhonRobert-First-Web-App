spring.application.name=userhub
server.port=8080

# H2 (file-based so data survives restarts; change to mem:userhubdb for a fresh DB each run)
spring.datasource.url=jdbc:h2:file:./data/userhubdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allowed frontend origin (CORS)
userhub.cors.allowed-origin=http://localhost:5173

# Default admin seeded on startup (override via environment variables if desired)
userhub.admin.username=${USERHUB_ADMIN_USERNAME:admin}
userhub.admin.password=${USERHUB_ADMIN_PASSWORD:admin123}
userhub.admin.fullName=System Administrator
userhub.admin.email=admin@userhub.local
